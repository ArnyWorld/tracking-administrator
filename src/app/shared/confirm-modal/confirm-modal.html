<div mat-dialog-title class="flex items-center gap-3">
  <div
    class="flex h-10 w-10 items-center justify-center rounded-full"
    [class.bg-red-100]="data.danger"
    [class.bg-blue-100]="!data.danger"
  >
    <mat-icon [class.text-red-600]="data.danger" [class.text-blue-600]="!data.danger">
      {{ data.danger ? 'warning' : 'help_outline' }}
    </mat-icon>
  </div>

  <span>
    {{ data.title ?? '¿Estás seguro?' }}
  </span>
</div>

<div mat-dialog-content class="text-gray-600">
  {{ data.content ?? 'Esta acción no se puede deshacer.' }}
</div>

<div mat-dialog-actions align="end" class="gap-2">
  <button mat-button type="button" (click)="cancel()">
    {{ data.cancelText ?? 'Cancelar' }}
  </button>

  <button
    mat-flat-button
    type="button"
    (click)="confirm()"
    [color]="data.danger ? 'warn' : 'primary'"
  >
    {{ data.okText ?? 'Aceptar' }}
  </button>
</div>
