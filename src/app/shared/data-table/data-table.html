<div class="relative w-full">
  @if (loading) {
    <div
      class="absolute inset-0 z-20 flex items-center justify-center bg-white/70 backdrop-blur-[1px]"
    >
      <mat-spinner diameter="42" aria-label="Cargando información" />
    </div>
  }

  <div class="w-full overflow-x-auto rounded-lg border border-slate-200">
    <table mat-table [dataSource]="dataSource" class="w-full">
      @for (column of columns; track column.key) {
        <ng-container [matColumnDef]="column.key.toString()">
          <th
            mat-header-cell
            *matHeaderCellDef
            [style.width]="column.width"
            [style.text-align]="column.align ?? 'left'"
            class="whitespace-nowrap bg-slate-50 px-4 py-3 text-xs font-semibold uppercase tracking-wide text-slate-600"
          >
            {{ column.label }}
          </th>

          <td
            mat-cell
            *matCellDef="let row"
            [style.text-align]="column.align ?? 'left'"
            class="px-4 py-3 text-sm text-slate-700"
          >
            @if (column.template) {
              <ng-container
                [ngTemplateOutlet]="column.template"
                [ngTemplateOutletContext]="{
                  $implicit: row,
                  row: row,
                  value: getValue(row, column.key),
                }"
              />

            } @else {
              {{ getValue(row, column.key) ?? '—' }}
            }
          </td>
        </ng-container>
      }

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns"
        class="transition-colors duration-150"
        [class.cursor-pointer]="clickableRows"
        [class.hover:bg-slate-50]="clickableRows"
        (click)="onRowClick(row)"
      ></tr>
    </table>

    @if (!loading && data.length === 0) {
      <div class="flex min-h-40 flex-col items-center justify-center gap-2 px-6 py-10 text-center">
        <mat-icon class="text-slate-400"> inbox </mat-icon>

        <p class="text-sm text-slate-500">
          {{ emptyMessage }}
        </p>
      </div>
    }
  </div>

  @if (showPaginator && total > 0) {
    <mat-paginator
      class="mt-2"
      [length]="total"
      [pageIndex]="pageIndex"
      [pageSize]="pageSize"
      [pageSizeOptions]="pageSizeOptions"
      [showFirstLastButtons]="true"
      (page)="onPageChange($event)"
    />
  }
</div>
