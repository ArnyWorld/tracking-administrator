<div class="min-h-full bg-slate-50 px-4 py-6 md:px-6 lg:px-8">
  <div class="mx-auto w-full max-w-6xl">
    @if (isAdmin) {
      <mat-stepper
        [selectedIndex]="current()"
        (selectedIndexChange)="current.set($event)"
        orientation="horizontal"
        class="bg-transparent!"
      >
        <mat-step label="Usuario">
          <div class="mt-6">
            <app-create-user (completed)="next()" />
          </div>

          <div class="mt-6 flex justify-end">
            <button mat-button type="button" [disabled]="current() === 0" (click)="previous()">
              Anterior
            </button>
          </div>
        </mat-step>

        <mat-step label="Empresa">
          <div class="mt-6">
            <app-create-company (completed)="finish()" />
          </div>

          <div class="mt-6 flex justify-start">
            <button mat-button type="button" (click)="previous()">Anterior</button>
          </div>
        </mat-step>
      </mat-stepper>
    } @else {
      <div class="mt-6">
        <app-create-user (completed)="finishUserCreation()" />
      </div>
    }
  </div>
</div>
