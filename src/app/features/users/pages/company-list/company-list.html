<div class="w-full p-6">
  <div class="mb-6 flex items-center justify-between">
    <div>
      <h2 class="text-2xl font-semibold text-slate-800">Lista de Empresas</h2>

      <p class="mt-1 text-sm text-slate-500">Gestiona las empresas registradas.</p>
    </div>

    <div class="flex items-center gap-2">
      <button mat-icon-button type="button" aria-label="Recargar empresas" (click)="reload()">
        <mat-icon>refresh</mat-icon>
      </button>

      <button mat-flat-button color="primary" routerLink="/app/user/create">
        <mat-icon>add</mat-icon>

        Registrar
      </button>
    </div>
  </div>

  <app-data-table
    [data]="companies"
    [columns]="columns"
    [loading]="isLoading()"
    [total]="total"
    [pageIndex]="pageIndex"
    [pageSize]="pageSize"
    (pageChange)="onPageChange($event)"
  />
</div>
