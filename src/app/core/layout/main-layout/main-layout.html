<mat-sidenav-container class="h-dvh bg-slate-950!">
  <mat-sidenav #sidenav mode="side" opened class="w-64 border-r border-slate-200 bg-slate-950!">
    <div class="flex h-full flex-col">
      <div class="flex h-16 shrink-0 items-center border-b border-white/10 px-5">
        <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-orange-600 text-white">
          <mat-icon> location_on </mat-icon>
        </div>

        <div class="ml-3">
          <div class="text-base font-bold text-white">
            Kerno<span class="text-orange-400">Tracking</span>
          </div>

          <div class="text-[9px] font-semibold uppercase tracking-[0.16em] text-slate-400">
            GPS Administrador
          </div>
        </div>
      </div>
      <nav class="flex-1 space-y-1 p-3" aria-label="Navegación principal">
        <div>
          <button
            type="button"
            (click)="usersMenuOpen = !usersMenuOpen"
            class="flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-left text-sm font-medium text-slate-300 transition hover:bg-white/10 hover:text-white"
          >
            <mat-icon>account_box</mat-icon>

            <span class="flex-1">Usuarios</span>

            <mat-icon class="transition-transform duration-200" [class.rotate-180]="usersMenuOpen">
              expand_more
            </mat-icon>
          </button>

          @if (usersMenuOpen) {
            <div class="ml-4 mt-1 space-y-1 border-l border-white/10 pl-3">
              <a
                routerLink="/app/user/create"
                routerLinkActive="bg-blue-600 text-white"
                class="flex items-center rounded-lg px-3 py-2 text-sm font-medium text-slate-400 transition hover:bg-white/10 hover:text-white cursor-pointer"
              >
                <span class="flex items-center gap-2"><mat-icon>add</mat-icon> Crear usuario</span>
              </a>

              <a
                routerLink="/app/user/company-list"
                routerLinkActive="bg-blue-600 text-white"
                [routerLinkActiveOptions]="{ exact: true }"
                class="flex items-center rounded-lg px-3 py-2 text-sm font-medium text-slate-400 transition hover:bg-white/10 hover:text-white cursor-pointer"
              >
                <span class="flex items-center gap-2">
                  <mat-icon>list</mat-icon>Listar empresas</span
                >
              </a>
              <a
                routerLink="/app/user/user-list"
                routerLinkActive="bg-blue-600 text-white"
                [routerLinkActiveOptions]="{ exact: true }"
                class="flex items-center rounded-lg px-3 py-2 text-sm font-medium text-slate-400 transition hover:bg-white/10 hover:text-white cursor-pointer"
              >
                <span class="flex items-center gap-2">
                  <mat-icon>list</mat-icon>Listar usuarios</span
                >
              </a>
            </div>
          }
        </div>

        <a
          href="http://172.21.11.28:4203/dashboard/live-gps"
          target="_blank"
          class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-slate-300 transition hover:bg-white/10 hover:text-white"
        >
          <mat-icon>location_on</mat-icon>

          <span>Monitoreo</span>
        </a>
      </nav>

      <div class="border-t border-white/10 p-3">
        <button
          [matMenuTriggerFor]="userMenu"
          class="h-auto! w-full! flex! flex-row! items-center! justify-start! rounded-lg! px-3! py-3! text-left! cursor-pointer"
        >
          <div
            class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-blue-600 text-sm font-semibold text-white"
          >
            {{ currentUser?.user?.username?.charAt(0)?.toUpperCase() ?? 'U' }}
          </div>

          <div class="ml-3 flex min-w-0 flex-1 flex-col items-start">
            <div class="w-full truncate text-sm font-semibold leading-5 text-white">
              {{ currentUser?.user?.username ?? 'Usuario' }}
            </div>

            <div class="w-full truncate text-xs leading-5 text-slate-400">
              {{ currentUser?.user?.email ?? '' }}
            </div>
          </div>

          <mat-icon class="ml-2 shrink-0 text-slate-400"> more_vert </mat-icon>
        </button>

        <mat-menu #userMenu="matMenu">
          <button mat-menu-item type="button">
            <mat-icon>person</mat-icon>
            <span>Mi perfil</span>
          </button>

          <button mat-menu-item type="button" (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>Cerrar sesión</span>
          </button>
        </mat-menu>
      </div>
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="border-b! border-slate-200! bg-white! text-slate-900!">
      <button
        mat-icon-button
        type="button"
        aria-label="Abrir o cerrar navegación"
        (click)="sidenav.toggle()"
      >
        <mat-icon> menu </mat-icon>
      </button>

      <span class="ml-2 text-base font-semibold"> Monitoreo GPS </span>

      <span class="flex-1"></span>

      <button mat-icon-button type="button" aria-label="Notificaciones">
        <mat-icon> notifications_none </mat-icon>
      </button>
    </mat-toolbar>

    <main class="min-h-[calc(100dvh-64px)] bg-slate-100 p-4 sm:p-6">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
