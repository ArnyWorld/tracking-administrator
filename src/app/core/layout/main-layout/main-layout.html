<mat-sidenav-container class="h-dvh bg-slate-100">
  <!-- =========================================================
       SIDEBAR
       ========================================================= -->
  <mat-sidenav #sidenav mode="side" opened class="w-64 border-r border-slate-200 bg-slate-950">
    <div class="flex h-full flex-col">
      <!-- Logo -->
      <div class="flex h-16 shrink-0 items-center border-b border-white/10 px-5">
        <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-blue-600 text-white">
          <mat-icon> location_on </mat-icon>
        </div>

        <div class="ml-3">
          <div class="text-base font-bold text-white">
            Fleet<span class="text-blue-400">Track</span>
          </div>

          <div class="text-[9px] font-semibold uppercase tracking-[0.16em] text-slate-400">
            GPS Management
          </div>
        </div>
      </div>

      <!-- Navegación -->
      <nav class="flex-1 space-y-1 p-3" aria-label="Navegación principal">
        <a
          routerLink="/app/dashboard"
          routerLinkActive="bg-blue-600 text-white"
          class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-slate-300 transition hover:bg-white/10 hover:text-white"
        >
          <mat-icon> dashboard </mat-icon>

          <span> Dashboard </span>
        </a>

        <!-- Futuros módulos -->

        <a
          routerLink="/app/vehicles"
          routerLinkActive="bg-blue-600 text-white"
          class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-slate-300 transition hover:bg-white/10 hover:text-white"
        >
          <mat-icon> directions_car </mat-icon>

          <span> Vehículos </span>
        </a>

        <a
          routerLink="/app/monitoring"
          routerLinkActive="bg-blue-600 text-white"
          class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-slate-300 transition hover:bg-white/10 hover:text-white"
        >
          <mat-icon> location_on </mat-icon>

          <span> Monitoreo </span>
        </a>
      </nav>

      <!-- Usuario -->
      <div class="border-t border-white/10 p-3">
        <button
          mat-button
          [matMenuTriggerFor]="userMenu"
          class="!flex !h-auto !w-full !items-center !justify-start !rounded-lg !px-3 !py-3 !text-left"
        >
          <div
            class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-blue-600 text-sm font-semibold text-white"
          >
            {{ currentUser?.name?.charAt(0) ?? 'U' }}
          </div>

          <div class="ml-3 min-w-0">
            <div class="truncate text-sm font-semibold text-white">
              {{ currentUser?.name ?? currentUser?.username ?? 'Usuario' }}
            </div>

            <div class="truncate text-xs text-slate-400">
              {{ currentUser?.email ?? currentUser?.username ?? '' }}
            </div>
          </div>

          <mat-icon class="ml-auto text-slate-400"> more_vert </mat-icon>
        </button>

        <mat-menu #userMenu="matMenu">
          <button mat-menu-item type="button">
            <mat-icon> person </mat-icon>

            <span> Mi perfil </span>
          </button>

          <button mat-menu-item type="button" (click)="logout()">
            <mat-icon> logout </mat-icon>

            <span> Cerrar sesión </span>
          </button>
        </mat-menu>
      </div>
    </div>
  </mat-sidenav>

  <!-- =========================================================
       CONTENIDO PRINCIPAL
       ========================================================= -->
  <mat-sidenav-content>
    <!-- Header -->
    <mat-toolbar class="!border-b !border-slate-200 !bg-white !text-slate-900">
      <button
        mat-icon-button
        type="button"
        aria-label="Abrir o cerrar navegación"
        (click)="sidenav.toggle()"
      >
        <mat-icon> menu </mat-icon>
      </button>

      <span class="ml-2 text-base font-semibold"> Monitoreo GPS </span>

      <span class="flex-1"></span>

      <button mat-icon-button type="button" aria-label="Notificaciones">
        <mat-icon> notifications_none </mat-icon>
      </button>
    </mat-toolbar>

    <!-- Página -->
    <main class="min-h-[calc(100dvh-64px)] bg-slate-100 p-4 sm:p-6">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
